name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    name: Lint e testes (PHP 8.2)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, redis
          coverage: none

      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependências
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validar composer.json
        run: composer validate --strict --no-check-publish

      - name: Lint de sintaxe PHP
        run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Testes de integração (Redis)
        run: composer test:integration
        env:
          REDIS_HOST: 127.0.0.1

  docker:
    name: Build das imagens Docker
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Criar .env a partir do modelo
        run: cp .env.example .env

      - name: Validar o docker-compose
        run: docker compose config --quiet

      - name: Construir a imagem do PHP
        run: docker compose build php